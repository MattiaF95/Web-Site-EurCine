<div class="site-shell">
  <header class="site-header">
    <a class="brand" routerLink="/home" aria-label="Eurcine Home">
      <img
        ngSrc="assets/images/logo.jpg"
        width="62"
        height="40"
        alt="Eurcine logo"
      />
      <span>Eurcine</span>
    </a>

    <div class="header-right">
      <nav class="site-nav" aria-label="Navigazione principale">
        <div class="film-search film-search--in-nav">
          <button type="button" class="film-search__icon" (click)="toggleSearch()" aria-label="Cerca film">🔍</button>
          @if (searchOpen()) {
            <div class="film-search__panel film-search__panel--left">
              <input
                class="film-search__input"
                type="text"
                placeholder="cerca film"
                [ngModel]="filmSearch()"
                (ngModelChange)="filmSearch.set($event)"
                (keydown.enter)="goToFilmSearch()"
              />
              <button type="button" class="film-search__submit" (click)="goToFilmSearch()">Cerca</button>
            </div>
          }
        </div>

        @for (item of navItems; track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            {{ item.label }}
          </a>
        }
      </nav>
    </div>
  </header>

  <main class="site-main">
    <router-outlet />
  </main>
</div>

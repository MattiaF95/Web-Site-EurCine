<div class="film-view-card">
  <h2 class="film-view-card__title">{{ film().titolo }}</h2>
  <p class="film-view-card__meta"><strong>Durata:</strong> {{ film().durataMin }} min</p>
  <p class="film-view-card__meta"><strong>Lingua:</strong> {{ film().linguaNome }}</p>
  <p class="film-view-card__meta"><strong>Generi:</strong> {{ film().generiNomi || '-' }}</p>
</div>

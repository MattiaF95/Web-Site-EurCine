<section class="page page-film">
  <div class="page__content page__content--wide">
    <div class="page__hero">
      <h1 class="page__title">In sala ora</h1>
      <p class="page__text">
        Catalogo film completo con durata, lingua e generi.
      </p>
    </div>

    @if (hasSelectedFilm() && selectedFilm(); as film) {
      <div class="film-actions">
        <button type="button" class="film-all-btn" (click)="viewAll()">Visualizza tutti i film</button>
      </div>
      <app-film-view [film]="film" />
    } @else {
      <div class="cards-grid cards-grid--films film-cards">
        @for (film of films(); track film.titolo) {
          <div class="showcase-card film-card" (click)="openFilm(film)">
            <h2 class="showcase-card__title">{{ film.titolo }}</h2>
            <p class="showcase-card__subtitle">{{ film.linguaNome }}</p>
            <p class="showcase-card__meta"><strong>Durata:</strong> {{ film.durataMin }} min</p>
            <p class="showcase-card__meta"><strong>Generi:</strong> {{ film.generiNomi || '-' }}</p>
          </div>
        }
      </div>
    }
  </div>
</section>

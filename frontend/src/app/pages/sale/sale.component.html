<section class="page page-sale">
  <div class="page__content page__content--wide">
    <div class="page__hero">
      <h1 class="page__title">Comfort, audio, immersione</h1>
      <p class="page__text">
        Elenco completo delle sale disponibili.
      </p>
    </div>

    @if (hasSelectedSala() && selectedSala(); as sala) {
      <div class="film-actions">
        <button type="button" class="film-all-btn" (click)="viewAll()">Visualizza tutte le sale</button>
      </div>
      <app-sala-view [sala]="sala" />
    } @else {
      <div class="cards-grid cards-grid--sale">
        @for (item of sale(); track item.nome) {
          <div class="sale-card" (click)="openSala(item.nome)">
            <app-showcase-card
              [title]="item.nome"
              [details]="buildCardDetails(item)"
              [subtitle]="item.descrizione || 'Sala disponibile'"
              [centered]="true"
              [large]="true"
            />
          </div>
        }
      </div>
    }
  </div>
</section>

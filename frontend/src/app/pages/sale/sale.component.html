<section class="page page-sale">
  <div class="page__content">
    <span class="page__kicker">Sale</span>
    <h1 class="page__title">Comfort, audio, immersione</h1>
    <p class="page__text">
      Elenco completo delle sale disponibili.
    </p>

    <div class="data-card">
      <h2 class="data-card__title">Tutte le Sale</h2>

      @if (sale$ | async; as sale) {
        <div class="wow-table-wrap">
          <table class="wow-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nome Sala</th>
              </tr>
            </thead>
            <tbody>
              @for (item of sale; track item.id) {
                <tr>
                  <td>{{ item.id }}</td>
                  <td>{{ item.nome }}</td>
                </tr>
              }
            </tbody>
          </table>
        </div>
      }
    </div>
  </div>
</section>

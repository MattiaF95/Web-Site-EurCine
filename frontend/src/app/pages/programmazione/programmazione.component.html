<section class="page page-programmazione">
  <div class="page__content page__content--wide">
    <div class="page__hero">
      <h1 class="page__title">Spettacoli della settimana</h1>
      <p class="page__text">
        Seleziona i film per il giorno scelto.
      </p>
      <h2 class="page__day-title">{{ currentDateLabel() }}</h2>
    </div>

    <div class="calendar-picker">
      <label for="day-select" class="calendar-picker__label">Giorno</label>
      <select
        id="day-select"
        class="calendar-picker__select"
        [ngModel]="selectedDate()"
        (ngModelChange)="onDateChange($event)"
      >
        @for (opt of dayOptions(); track opt.value) {
          <option [value]="opt.value">{{ opt.label }}</option>
        }
      </select>
    </div>

    <div class="page__notice">
      Prezzo ridotto prima delle 18:00, prezzo standard dopo le 18:00. I film iniziano 15 minuti dopo
      l'orario indicato.
    </div>

    <div class="cards-grid cards-grid--films">
      @for (card of cards(); track card.title) {
        <app-showcase-card
          [title]="card.title"
          [subtitle]="card.subtitle"
          [slots]="card.slots"
          [lineTwo]="card.lineTwo"
          (slotSelected)="goToSeatMap($event)"
        />
      }
    </div>
  </div>
</section>

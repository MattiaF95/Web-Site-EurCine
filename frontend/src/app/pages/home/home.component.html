<section class="page page-home">
  <div class="page__content page__content--wide">
    <div class="page__hero">
      <h1 class="page__title">Il cinema che accende la tua serata</h1>
      <p class="page__text">
        Programmazione completa in tempo reale con sale, orari e prezzi.
      </p>
      <h2 class="page__day-title">{{ displayDate }}</h2>
    </div>

    <div class="page__notice">
      Prezzo ridotto prima delle 18:00, prezzo standard dopo le 18:00. I film iniziano 15 minuti dopo
      l'orario indicato.
    </div>

    <div class="cards-grid cards-grid--films">
      @for (card of cards(); track card.title) {
        <app-showcase-card
          [title]="card.title"
          [subtitle]="card.subtitle"
          [slots]="card.slots"
          [lineTwo]="card.lineTwo"
          (slotSelected)="goToSeatMap($event)"
        />
      }
    </div>
  </div>
</section>

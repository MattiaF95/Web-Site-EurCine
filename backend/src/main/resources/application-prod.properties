server.port=${PORT:8080}

# Render production settings (set these env vars in Render service)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Production: schema/data managed by Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
app.read-only-mode=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Swagger/OpenAPI disabled in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Comma-separated frontend origins allowed to call API with credentials
# Example: app.cors.allowed-origins=https://mio-sito-frontend.com
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-days=${JWT_EXPIRATION_DAYS:7}

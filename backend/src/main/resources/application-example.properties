spring.application.name=eurcine

# Example configuration using only vars already used by local/prod files.
# Local: defaults are used.
# Production: set env vars explicitly.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/eurcine?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Local default is development-friendly; in production use validate.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# In production set CORS_ALLOWED_ORIGINS and JWT_SECRET explicitly.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.jwt.secret=${JWT_SECRET:change-this-example-secret-at-least-32-characters}
app.jwt.expiration-days=${JWT_EXPIRATION_DAYS:7}

# Local default
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Swagger/OpenAPI default example values
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

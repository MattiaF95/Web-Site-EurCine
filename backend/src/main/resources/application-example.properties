spring.application.name=eurcine

# Example DB URL
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/example_db
# Example DB user
spring.datasource.username=example_user
# Example DB password
spring.datasource.password=example_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# First run: create/update tables from entities
# After first creation set: spring.jpa.hibernate.ddl-auto=validate
# Validate checks DB schema and entity mapping consistency
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT secret must be at least 32 chars
app.jwt.secret=change-this-example-secret-at-least-32-characters
app.jwt.expiration-days=7
